<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <!-- vision glass, upper curtain wall -->
    <linearGradient id="glassHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8898f0"/>
      <stop offset=".55" stop-color="#5468e0"/>
      <stop offset="1" stop-color="#3a4cc0"/>
    </linearGradient>
    <linearGradient id="glassLo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32448f"/>
      <stop offset="1" stop-color="#26346e"/>
    </linearGradient>
    <!-- entrance glass: mostly clear, warm interior behind -->
    <linearGradient id="lobbyGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ea3e8" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#6d84d4" stop-opacity=".30"/>
      <stop offset="1" stop-color="#4c5fa8" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c6d6"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="letterFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset=".5" stop-color="#c9d0da"/>
      <stop offset=".55" stop-color="#aab2bf"/>
      <stop offset="1" stop-color="#e2e7ee"/>
    </linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8dde4"/>
      <stop offset=".5" stop-color="#9aa2ae"/>
      <stop offset="1" stop-color="#6a707b"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc9b4"/>
      <stop offset="1" stop-color="#b0a98e"/>
    </linearGradient>
    <linearGradient id="pave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5b1a6"/>
      <stop offset="1" stop-color="#d6d2c7"/>
    </linearGradient>
    <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4630"/>
      <stop offset=".45" stop-color="#8a6a42"/>
      <stop offset="1" stop-color="#c9a66c"/>
    </linearGradient>
    <radialGradient id="globe" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#fdf7e2"/>
      <stop offset=".7" stop-color="#f0dda6"/>
      <stop offset="1" stop-color="#d9b96e"/>
    </radialGradient>
  </defs>

  <!-- ===================== SKY (top-right, above the podium wing) -->
  <rect x="440" y="0" width="200" height="230" fill="url(#sky)"/>
  <!-- distant tower silhouettes -->
  <rect x="596" y="18" width="44" height="212" fill="#c2ccd8"/>
  <rect x="560" y="64" width="36" height="166" fill="#cdd6e0"/>
  <rect x="604" y="30" width="2" height="180" fill="#b3bfcc"/>
  <rect x="614" y="30" width="2" height="180" fill="#b3bfcc"/>
  <rect x="624" y="30" width="2" height="180" fill="#b3bfcc"/>
  <!-- clouds -->
  <ellipse cx="530" cy="40" rx="55" ry="14" fill="#f4f7fa" opacity=".9"/>
  <ellipse cx="575" cy="52" rx="40" ry="10" fill="#eef2f6" opacity=".8"/>
  <ellipse cx="500" cy="90" rx="34" ry="8" fill="#f4f7fa" opacity=".7"/>

  <!-- ===================== LEFT NEIGHBOR PIER -->
  <rect x="0" y="0" width="34" height="480" fill="#6f7480"/>
  <rect x="26" y="0" width="8" height="480" fill="#4c515b"/>
  <rect x="0" y="0" width="6" height="480" fill="#8a8f9a"/>

  <!-- ===================== MAIN TOWER FACE (frontal, x34..470) -->
  <!-- upper curtain wall rises out of frame -->
  <rect x="34" y="0" width="436" height="176" fill="url(#glassHi)"/>
  <!-- horizontal spandrel bands -->
  <rect x="34" y="34" width="436" height="12" fill="#1d5a4e"/>
  <rect x="34" y="88" width="436" height="12" fill="#1d5a4e"/>
  <rect x="34" y="142" width="436" height="12" fill="#1d5a4e"/>
  <rect x="34" y="34" width="436" height="3" fill="#2e7a6a"/>
  <rect x="34" y="88" width="436" height="3" fill="#2e7a6a"/>
  <rect x="34" y="142" width="436" height="3" fill="#2e7a6a"/>
  <!-- vertical mullions -->
  <g fill="#26346e">
    <rect x="82" y="0" width="4" height="176"/>
    <rect x="130" y="0" width="4" height="176"/>
    <rect x="178" y="0" width="4" height="176"/>
    <rect x="226" y="0" width="4" height="176"/>
    <rect x="274" y="0" width="4" height="176"/>
    <rect x="322" y="0" width="4" height="176"/>
    <rect x="370" y="0" width="4" height="176"/>
    <rect x="418" y="0" width="4" height="176"/>
  </g>
  <!-- diagonal sun glare across the glass -->
  <polygon points="120,0 260,0 90,176 34,176 34,130" fill="#ffffff" opacity=".16"/>
  <polygon points="300,0 360,0 190,176 150,176" fill="#ffffff" opacity=".10"/>

  <!-- ===================== SIGN FASCIA BAND -->
  <rect x="34" y="108" width="436" height="70" fill="#14352e"/>
  <rect x="34" y="108" width="436" height="4" fill="#2e7a6a"/>
  <rect x="34" y="172" width="436" height="6" fill="#0b241f"/>

  <!-- extruded sign letters (drawn late, above canopy) — see below -->

  <!-- ===================== CANOPY -->
  <!-- tension rods -->
  <g stroke="#3a3f47" stroke-width="3">
    <line x1="76" y1="180" x2="96" y2="112"/>
    <line x1="432" y1="180" x2="412" y2="112"/>
  </g>
  <!-- slab -->
  <rect x="52" y="178" width="404" height="6" fill="#7d838d"/>
  <rect x="52" y="184" width="404" height="10" fill="#3a3f47"/>
  <rect x="52" y="192" width="404" height="2" fill="#23262c"/>

  <!-- ===================== ENTRANCE LOBBY (y194..392) -->
  <!-- interior scene, painted first, glass laid over -->
  <rect x="46" y="194" width="416" height="198" fill="url(#interior)"/>
  <!-- interior back wall + elevator bank -->
  <rect x="46" y="206" width="416" height="108" fill="#7a5f3e"/>
  <rect x="46" y="206" width="416" height="10" fill="#5a4630"/>
  <rect x="46" y="286" width="416" height="6" fill="#5a4630"/>
  <!-- lit feature wall behind reception -->
  <rect x="204" y="222" width="176" height="64" fill="#c9a66c" opacity=".45"/>
  <!-- elevator bank, left bay -->
  <rect x="64" y="230" width="26" height="84" fill="url(#steelV)"/>
  <rect x="94" y="230" width="26" height="84" fill="url(#steelV)"/>
  <rect x="89" y="230" width="4" height="84" fill="#2f3339"/>
  <rect x="64" y="225" width="56" height="4" fill="#e8c88e"/>
  <!-- reception desk, right bay -->
  <rect x="390" y="272" width="62" height="42" fill="#8a5a2e"/>
  <rect x="390" y="266" width="62" height="8" fill="#b07a42"/>
  <rect x="390" y="268" width="62" height="2" fill="#e8c88e"/>
  <!-- interior floor: pale stone + teal runner to the doors -->
  <rect x="46" y="314" width="416" height="78" fill="#d8c9a6"/>
  <polygon points="216,392 292,392 276,314 232,314" fill="#167060"/>
  <polygon points="222,392 228,392 236,314 234,314" fill="#2e8a78"/>
  <polygon points="280,392 286,392 274,314 272,314" fill="#2e8a78"/>
  <!-- pendant globes (echo of the 1994 transom lights) -->
  <g>
    <line x1="130" y1="206" x2="130" y2="226" stroke="#2c2418" stroke-width="2"/>
    <line x1="192" y1="206" x2="192" y2="230" stroke="#2c2418" stroke-width="2"/>
    <line x1="254" y1="206" x2="254" y2="233" stroke="#2c2418" stroke-width="2"/>
    <line x1="316" y1="206" x2="316" y2="230" stroke="#2c2418" stroke-width="2"/>
    <line x1="378" y1="206" x2="378" y2="226" stroke="#2c2418" stroke-width="2"/>
    <circle cx="130" cy="234" r="9" fill="url(#globe)"/>
    <circle cx="192" cy="238" r="10" fill="url(#globe)"/>
    <circle cx="254" cy="242" r="11" fill="url(#globe)"/>
    <circle cx="316" cy="238" r="10" fill="url(#globe)"/>
    <circle cx="378" cy="234" r="9" fill="url(#globe)"/>
  </g>

  <!-- entrance glass over the interior -->
  <rect x="46" y="194" width="416" height="198" fill="url(#lobbyGlass)"/>
  <!-- under-canopy shadow on the glass -->
  <rect x="46" y="194" width="416" height="16" fill="#1a2030" opacity=".45"/>

  <!-- entrance mullions -->
  <g fill="#3a4149">
    <rect x="46" y="194" width="6" height="198"/>
    <rect x="126" y="194" width="5" height="198"/>
    <rect x="196" y="194" width="5" height="198"/>
    <rect x="308" y="194" width="5" height="198"/>
    <rect x="378" y="194" width="5" height="198"/>
    <rect x="456" y="194" width="6" height="198"/>
    <rect x="46" y="252" width="416" height="4"/>
  </g>
  <g fill="#8f97a2">
    <rect x="52" y="194" width="2" height="198"/>
    <rect x="131" y="194" width="2" height="198"/>
    <rect x="201" y="194" width="2" height="198"/>
    <rect x="313" y="194" width="2" height="198"/>
    <rect x="383" y="194" width="2" height="198"/>
  </g>

  <!-- revolving door, center bay -->
  <g>
    <rect x="216" y="258" width="76" height="134" fill="#20262e" opacity=".25"/>
    <rect x="216" y="258" width="6" height="134" fill="url(#steelV)"/>
    <rect x="286" y="258" width="6" height="134" fill="url(#steelV)"/>
    <rect x="216" y="258" width="76" height="6" fill="url(#steelV)"/>
    <!-- drum + wings -->
    <ellipse cx="254" cy="386" rx="34" ry="7" fill="#20262e" opacity=".5"/>
    <line x1="254" y1="266" x2="254" y2="390" stroke="#4a5058" stroke-width="4"/>
    <line x1="228" y1="290" x2="280" y2="380" stroke="#aebdd8" stroke-width="3" opacity=".8"/>
    <line x1="280" y1="290" x2="228" y2="380" stroke="#aebdd8" stroke-width="3" opacity=".8"/>
  </g>
  <!-- flanking glass doors with long stainless pulls -->
  <g>
    <rect x="136" y="268" width="56" height="124" fill="#94a8dc" opacity=".28"/>
    <rect x="162" y="268" width="3" height="124" fill="#3a4149"/>
    <rect x="150" y="292" width="4" height="66" fill="url(#steelV)"/>
    <rect x="174" y="292" width="4" height="66" fill="url(#steelV)"/>
    <rect x="318" y="268" width="56" height="124" fill="#94a8dc" opacity=".28"/>
    <rect x="344" y="268" width="3" height="124" fill="#3a4149"/>
    <rect x="332" y="292" width="4" height="66" fill="url(#steelV)"/>
    <rect x="356" y="292" width="4" height="66" fill="url(#steelV)"/>
  </g>

  <!-- ===================== RIGHT PODIUM WING (receding) -->
  <polygon points="462,150 640,196 640,428 462,392" fill="url(#stone)"/>
  <!-- stone joints, receding -->
  <g stroke="#948c72" stroke-width="2">
    <line x1="462" y1="212" x2="640" y2="252"/>
    <line x1="462" y1="272" x2="640" y2="306"/>
    <line x1="462" y1="330" x2="640" y2="360"/>
    <line x1="500" y1="160" x2="500" y2="400"/>
    <line x1="556" y1="174" x2="556" y2="410"/>
    <line x1="610" y1="188" x2="610" y2="422"/>
  </g>
  <!-- top edge highlight -->
  <polygon points="462,150 640,196 640,204 462,158" fill="#e2dcc8"/>
  <!-- tribute plaque (echo of the 1994 pink sign) -->
  <g>
    <polygon points="492,190 606,219 606,288 492,258" fill="#d89aa0"/>
    <polygon points="492,190 606,219 606,226 492,196" fill="#e8b4ba"/>
    <polygon points="498,248 600,275 600,280 498,253" fill="#7c2f36"/>
    <text x="549" y="224" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#7c2f36" text-anchor="middle" transform="rotate(8 549 224)">INSPIRED BY</text>
    <text x="549" y="250" font-family="Liberation Serif" font-size="23" font-weight="bold" fill="#7c2f36" text-anchor="middle" transform="rotate(8 549 250)">YOOT SAITO</text>
  </g>

  <!-- ===================== SIDEWALK -->
  <rect x="0" y="392" width="640" height="88" fill="url(#pave)"/>
  <!-- receding curb line under the podium -->
  <polygon points="462,392 640,428 640,438 462,400" fill="#9b968a"/>
  <!-- pavement joints radiating gently -->
  <g stroke="#aaa699" stroke-width="2">
    <line x1="80" y1="392" x2="40" y2="480"/>
    <line x1="160" y1="392" x2="140" y2="480"/>
    <line x1="254" y1="392" x2="254" y2="480"/>
    <line x1="350" y1="392" x2="372" y2="480"/>
    <line x1="430" y1="392" x2="470" y2="480"/>
    <line x1="34" y1="428" x2="462" y2="428"/>
    <line x1="34" y1="462" x2="640" y2="462"/>
  </g>
  <!-- warm light spilling from the doors -->
  <polygon points="216,392 292,392 330,480 180,480" fill="#f2c878" opacity=".12"/>
  <polygon points="140,392 190,392 176,480 110,480" fill="#e8f0ff" opacity=".10"/>
  <polygon points="320,392 372,392 400,480 340,480" fill="#e8f0ff" opacity=".10"/>
  <!-- bollards -->
  <g>
    <rect x="112" y="398" width="10" height="30" fill="url(#steelV)"/>
    <ellipse cx="117" cy="398" rx="5" ry="2" fill="#d8dde4"/>
    <rect x="396" y="398" width="10" height="30" fill="url(#steelV)"/>
    <ellipse cx="401" cy="398" rx="5" ry="2" fill="#d8dde4"/>
  </g>

  <!-- ===================== PLANTER + TREES (right, echo of the twin conifers) -->
  <g>
    <polygon points="474,352 636,384 636,428 474,394" fill="#8f8874"/>
    <polygon points="474,352 636,384 636,392 474,359" fill="#c4bda4"/>
    <!-- trunks -->
    <rect x="520" y="330" width="7" height="34" fill="#4a3620"/>
    <rect x="592" y="350" width="7" height="42" fill="#4a3620"/>
    <!-- rounded contemporary canopies -->
    <circle cx="524" cy="306" r="31" fill="#375c3c"/>
    <circle cx="512" cy="298" r="17" fill="#4f7f54"/>
    <circle cx="536" cy="291" r="13" fill="#4f7f54"/>
    <circle cx="519" cy="286" r="9" fill="#82ad74"/>
    <circle cx="596" cy="324" r="29" fill="#375c3c"/>
    <circle cx="585" cy="315" r="15" fill="#4f7f54"/>
    <circle cx="606" cy="310" r="12" fill="#4f7f54"/>
    <circle cx="592" cy="304" r="8" fill="#82ad74"/>
  </g>

  <!-- ===================== EXTRUDED SIGN LETTERS (topmost) -->
  <g font-family="Liberation Serif" font-weight="bold" font-size="44" text-anchor="middle">
    <text x="257" y="160" fill="#23262c">CONCILIA TOWER</text>
    <text x="256" y="159" fill="#2f333b">CONCILIA TOWER</text>
    <text x="255" y="158" fill="#3b404a">CONCILIA TOWER</text>
    <text x="254" y="157" fill="#474d59">CONCILIA TOWER</text>
    <text x="253" y="156" fill="#535a68">CONCILIA TOWER</text>
    <text x="252" y="155" fill="url(#letterFace)">CONCILIA TOWER</text>
  </g>
</svg>
